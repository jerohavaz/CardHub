name: cardhub
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: cardhub_example
      POSTGRES_USER: cardhub
      POSTGRES_PASSWORD: cardhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardhub -d cardhub_example"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://cardhub:cardhub@postgres:5432/cardhub_example?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations/example
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  service-example:
    build:
      context: .
      dockerfile: service-example/Dockerfile
    environment:
      APP_ENV: production
      GRPC_ADDR: :9000
      DATABASE_URL: postgres://cardhub:cardhub@postgres:5432/cardhub_example?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      EXAMPLE_GRPC_ADDR: service-example:9000
    depends_on:
      - service-example
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
