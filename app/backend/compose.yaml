name: cardhub

# ============================================================
# Shared Configuration
# ============================================================

x-database: &database
  DATABASE_URL: postgres://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:?required}?sslmode=disable

x-common: &common
  APP_ENV: ${APP_ENV:-development}

x-jwt: &jwt
  JWT_ISSUER: ${JWT_ISSUER:-cardhub-identity}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-cardhub-api}

# ============================================================
# Infrastructure
# ============================================================

services:
  # PostgreSQL
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardhub -d cardhub"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  # Database migrations
  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    environment:
      <<: *database
      GOOSE_DRIVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export GOOSE_DBSTRING="$$DATABASE_URL"

        for service in example identity; do
          echo "Migrating $${service}..."
          export GOOSE_MIGRATION_DIR="/migrations/$${service}"
          export GOOSE_TABLE="goose_$${service}_version"
          goose up
        done

  # JWT signing key initialization
  jwt-init:
    build:
      context: .
      dockerfile: init/Dockerfile
    volumes:
      - jwt_private:/keys/private
      - jwt_public:/keys/public
    restart: "no"

  # ==========================================================
  # Backend Services
  # ==========================================================

  # Example service
  service-example:
    build:
      context: .
      dockerfile: service-example/Dockerfile
    environment:
      <<: [*common, *database]
      GRPC_ADDR: :9000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Identity and authentication service
  identity:
    build:
      context: .
      dockerfile: identity/Dockerfile
    environment:
      <<: [*common, *database, *jwt]
      GRPC_ADDR: :9001
      JWT_KEY_PATH: /run/keys/jwt-private.pem
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
    volumes:
      - jwt_private:/run/keys:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      jwt-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Public HTTP API Gateway
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      <<: [*common, *jwt]
      HTTP_ADDR: :8080
      EXAMPLE_GRPC_ADDR: service-example:9000
      IDENTITY_GRPC_ADDR: identity:9001
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
    volumes:
      - jwt_public:/run/keys:ro
    depends_on:
      service-example:
        condition: service_started
      identity:
        condition: service_started
      jwt-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

# ============================================================
# Persistent Volumes
# ============================================================

volumes:
  postgres_data:
  jwt_private:
  jwt_public:
