name: Backend CI

on:
  push:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            app/backend/foundation/go.sum
            app/backend/protocol/go.sum
            app/backend/service-example/go.sum
            app/backend/gateway/go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Run unit tests
        run: make test